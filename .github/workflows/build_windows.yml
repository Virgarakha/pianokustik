name: Build PianoKustik Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Release EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath PianoKustik-Windows-x64.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoKustik-Windows-x64
          path: PianoKustik-Windows-x64.zip
          retention-days: 30
